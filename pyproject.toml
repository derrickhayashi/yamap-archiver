[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yamap-archiver"
version = "0.1.0"
description = "Local YAMAP activity and GPX archiving"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
login = ["playwright>=1.45"]

[project.scripts]
yamap-archiver = "yamap_sync_core.cli:main"

[tool.setuptools.packages.find]
include = ["yamap_sync_core*"]
